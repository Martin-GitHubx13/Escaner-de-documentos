<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><meta name="mobile-web-app-capable" content="yes">
<title>Escáner v1.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--card:#fff;--bd:#e2e8f0;--ac:#0891b2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f172a;--fg:#f1f5f9;--card:#1e293b;--bd:#334155;--ac:#22d3ee}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px;font-weight:700;font-size:18px}
section{padding:0 16px 24px;max-width:640px;margin:auto}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:12px 14px;border-radius:12px;cursor:pointer;display:inline-block}
.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1;text-align:center}
canvas{width:100%;height:auto;max-height:65vh;object-fit:contain;display:block;background:var(--card);border-radius:8px;touch-action:none}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.t{position:relative}.t img{width:100%;border-radius:8px;border:1px solid var(--bd);display:block}
.t button{position:absolute;top:4px;right:4px;padding:2px 8px;border-radius:99px}
.t span{position:absolute;bottom:4px;left:6px;background:#000a;color:#fff;border-radius:6px;padding:0 6px;font-size:12px}
.on{background:var(--ac);color:#fff}label{display:block;font-size:14px;margin-top:8px}input[type=range]{width:100%}
.empty{text-align:center;opacity:.6;padding:40px 0}
</style></head><body>
<header>📄 Escáner <small style="font-weight:400;opacity:.6">v1.0</small></header>

<section id="home">
 <div class="row">
  <label class="btn p" style="margin:0">📷 Cámara<input id="fc" type="file" accept="image/*" capture="environment" hidden></label>
  <label class="btn" style="margin:0">🖼 Galería<input id="fg" type="file" accept="image/*" multiple hidden></label>
 </div>
 <div id="grid"></div>
 <div class="empty" id="empty">Aún no hay páginas.<br>Toma una foto o elige imágenes.</div>
 <div class="row" id="exp" hidden>
  <button class="p" onclick="toPDF()">PDF</button><button class="p" onclick="toDOCX()">Word</button><button class="p" onclick="toJPG()">JPG</button>
 </div>
</section>

<section id="crop" hidden>
 <p>Arrastra las esquinas para ajustar el recorte.</p>
 <canvas id="cv"></canvas>
 <div class="row"><button onclick="next()">Omitir</button><button class="p" onclick="goEdit()">Siguiente</button></div>
</section>

<section id="edit" hidden>
 <canvas id="pv"></canvas>
 <div class="row" id="modes">
  <button data-m="orig">Original</button><button data-m="doc" class="on">Documento</button><button data-m="gris">Gris</button><button data-m="bw">B/N</button>
 </div>
 <label>Brillo <input id="br" type="range" min="-60" max="60" value="0"></label>
 <label>Contraste <input id="ct" type="range" min="0.6" max="2" step="0.05" value="1"></label>
 <div class="row"><button onclick="rot()">⟳ Rotar</button><button class="p" onclick="addPage()">Añadir página</button></div>
</section>

<script>
const $=s=>document.querySelector(s),show=id=>document.querySelectorAll('section').forEach(s=>s.hidden=s.id!=id);
let pages=[],queue=[],src,pts,base,cur,mode='doc',drag=-1;
const cv=$('#cv'),cx=cv.getContext('2d'),pv=$('#pv');

['fc','fg'].forEach(id=>$('#'+id).onchange=e=>{queue=[...e.target.files];e.target.value='';next()});

function next(){
 if(!queue.length){show('home');render();return}
 const im=new Image();
 im.onload=()=>{
  const r=Math.min(1,1800/Math.max(im.width,im.height));
  src=document.createElement('canvas');src.width=Math.round(im.width*r);src.height=Math.round(im.height*r);
  src.getContext('2d').drawImage(im,0,0,src.width,src.height);URL.revokeObjectURL(im.src);
  const w=src.width,h=src.height,m=.06;
  pts=[[w*m,h*m],[w*(1-m),h*m],[w*(1-m),h*(1-m)],[w*m,h*(1-m)]];
  cv.width=w;cv.height=h;show('crop');draw();
 };
 im.src=URL.createObjectURL(queue.shift());
}
function draw(){
 cx.drawImage(src,0,0);cx.beginPath();
 pts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.closePath();
 cx.fillStyle='rgba(34,211,238,.25)';cx.fill();cx.lineWidth=cv.width/250;cx.strokeStyle='#22d3ee';cx.stroke();
 pts.forEach(p=>{cx.beginPath();cx.arc(p[0],p[1],cv.width/30,0,7);cx.fillStyle='#22d3ee';cx.fill()});
}
const pos=e=>{const r=cv.getBoundingClientRect(),k=cv.width/r.width;return[(e.clientX-r.left)*k,(e.clientY-r.top)*k]};
cv.onpointerdown=e=>{const q=pos(e);let b=1e9;pts.forEach((p,i)=>{const d=Math.hypot(p[0]-q[0],p[1]-q[1]);if(d<b){b=d;drag=i}});cv.setPointerCapture(e.pointerId);cv.onpointermove(e)};
cv.onpointermove=e=>{if(drag<0)return;const q=pos(e);pts[drag]=[Math.max(0,Math.min(cv.width,q[0])),Math.max(0,Math.min(cv.height,q[1]))];draw()};
cv.onpointerup=()=>drag=-1;

function warp(){
 const[a,b,c,d]=pts,D=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
 const W=Math.round(Math.max(D(a,b),D(d,c))),H=Math.round(Math.max(D(a,d),D(b,c)));
 if(W<20||H<20){alert('Recorte demasiado pequeño');return null}
 const o=document.createElement('canvas');o.width=W;o.height=H;
 const oc=o.getContext('2d'),od=oc.createImageData(W,H),sw=src.width,sh=src.height,s=src.getContext('2d').getImageData(0,0,sw,sh).data;
 for(let y=0;y<H;y++){const v=y/H;for(let x=0;x<W;x++){const u=x/W;
  const X=(1-v)*((1-u)*a[0]+u*b[0])+v*((1-u)*d[0]+u*c[0]),Y=(1-v)*((1-u)*a[1]+u*b[1])+v*((1-u)*d[1]+u*c[1]);
  const x0=Math.min(sw-2,Math.max(0,X|0)),y0=Math.min(sh-2,Math.max(0,Y|0)),fx=X-x0,fy=Y-y0,i=(y*W+x)*4,j0=(y0*sw+x0)*4;
  for(let k=0;k<3;k++){const j=j0+k;od.data[i+k]=(s[j]*(1-fx)+s[j+4]*fx)*(1-fy)+(s[j+sw*4]*(1-fx)+s[j+sw*4+4]*fx)*fy}
  od.data[i+3]=255}}
 oc.putImageData(od,0,0);return o;
}
function goEdit(){base=warp();if(!base)return;$('#br').value=0;$('#ct').value=1;enh();show('edit')}
function rot(){const o=document.createElement('canvas');o.width=base.height;o.height=base.width;const c=o.getContext('2d');c.translate(o.width,0);c.rotate(Math.PI/2);c.drawImage(base,0,0);base=o;enh()}

function enh(){
 const W=base.width,H=base.height,o=document.createElement('canvas');o.width=W;o.height=H;
 const c=o.getContext('2d');c.drawImage(base,0,0);
 const im=c.getImageData(0,0,W,H),d=im.data,br=+$('#br').value,k=+$('#ct').value;let bg;
 if(mode=='doc'||mode=='bw'){ // quita sombras dividiendo entre el fondo estimado
  const t=document.createElement('canvas');t.width=Math.max(1,W>>4);t.height=Math.max(1,H>>4);
  t.getContext('2d').drawImage(base,0,0,t.width,t.height);
  const u=document.createElement('canvas');u.width=W;u.height=H;const uc=u.getContext('2d');
  uc.imageSmoothingQuality='high';uc.drawImage(t,0,0,W,H);bg=uc.getImageData(0,0,W,H).data;
 }
 for(let i=0;i<d.length;i+=4){
  let v=[d[i],d[i+1],d[i+2]];
  if(bg)v=v.map((x,j)=>Math.min(255,x*245/(bg[i+j]||1)));
  if(mode=='gris'||mode=='bw'){const g=.3*v[0]+.59*v[1]+.11*v[2];v=[g,g,g]}
  if(mode=='bw'){const x=v[0]>175-br?255:0;v=[x,x,x]}
  else v=v.map(x=>(x-128)*k+128+br);
  d[i]=v[0];d[i+1]=v[1];d[i+2]=v[2];
 }
 c.putImageData(im,0,0);cur=o;pv.width=W;pv.height=H;pv.getContext('2d').drawImage(o,0,0);
}
$('#modes').onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b===e.target));enh()};
$('#br').oninput=$('#ct').oninput=()=>enh();

function addPage(){
 const t=document.createElement('canvas');t.width=240;t.height=Math.round(240*cur.height/cur.width);
 t.getContext('2d').drawImage(cur,0,0,t.width,t.height);
 pages.push({c:cur,t:t.toDataURL('image/jpeg',.6)});next();
}
function render(){
 $('#grid').innerHTML=pages.map((p,i)=>`<div class="t"><img src="${p.t}"><span>${i+1}</span><button onclick="pages.splice(${i},1);render()">✕</button></div>`).join('');
 $('#empty').hidden=pages.length>0;$('#exp').hidden=!pages.length;
}

function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const jpg=c=>new Promise(r=>c.toBlob(r,'image/jpeg',.92));

async function toJPG(){for(let i=0;i<pages.length;i++){save(await jpg(pages[i].c),`pagina-${i+1}.jpg`);await new Promise(r=>setTimeout(r,400))}}

function toPDF(){
 const pdf=new jspdf.jsPDF({unit:'mm',format:'a4'});
 pages.forEach((p,i)=>{
  if(i)pdf.addPage();
  const r=Math.min(210/p.c.width,297/p.c.height),w=p.c.width*r,h=p.c.height*r;
  pdf.addImage(p.c.toDataURL('image/jpeg',.92),'JPEG',(210-w)/2,(297-h)/2,w,h);
 });
 pdf.save('escaneo.pdf');
}

async function toDOCX(){
 const z=new JSZip();let rel='',body='';
 pages.forEach((p,i)=>{
  const n=i+1;z.file(`word/media/p${n}.jpg`,p.c.toDataURL('image/jpeg',.9).split(',')[1],{base64:true});
  rel+=`<Relationship Id="rId${n+10}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/p${n}.jpg"/>`;
  let ew=5760000,eh=ew*p.c.height/p.c.width;if(eh>8000000){ew=ew*8000000/eh;eh=8000000}
  ew=Math.round(ew);eh=Math.round(eh);
  body+=(i?'<w:p><w:r><w:br w:type="page"/></w:r></w:p>':'')+
  `<w:p><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${ew}" cy="${eh}"/><wp:docPr id="${n}" name="Pagina ${n}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${n}" name="p${n}.jpg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rId${n+10}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${ew}" cy="${eh}"/></a:xfrm><a:prstGeom prst="rect"/></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
 });
 const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
 z.file('[Content_Types].xml',H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
 z.file('_rels/.rels',H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
 z.file('word/_rels/document.xml.rels',H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rel+'</Relationships>');
 z.file('word/document.xml',H+'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>'+body+'</w:body></w:document>');
 save(await z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),'escaneo.docx');
}
render();
</script></body></html>
